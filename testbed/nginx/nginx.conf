worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Default server (catches all)
    server {
        listen       80 default_server;
        server_name  _;
        root   /usr/share/nginx/html/www;
        index  index.html index.htm;
        
        # Ground Truth: Directory listing enabled on /backup
        location /backup {
            autoindex on;
        }
    }

    # Dev server with planted .git
    server {
        listen       80;
        server_name  dev.corp-testbed.local;
        root   /usr/share/nginx/html/dev;
        index  index.html;
    }
}
